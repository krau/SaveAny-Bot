services:
  saveany-bot:
    build: .
    container_name: saveany-bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    # 首次启动时指定管理员密码；留空则自动生成并打印到日志
    # Set the admin password on first start; leave empty to generate one in the log
    # environment:
    #   SAVEANY_ADMIN_PASSWORD: change-me
    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads
      - ./cache:/app/cache
    # 使用 host 模式以便访问宿主机服务 (如代理)
    # 如果你对 Docker 网络模式熟悉, 可以自行修改
    network_mode: host
