bot:
  msg:
    help_text_fmt: |
      Save Any Bot - 转存你的 Telegram 文件
      版本: %s , 提交: %s

      命令:
      /start - 打开帮助和命令列表
      /save - 保存回复的媒体或批量消息
      /download - 下载链接（直链、Aria2 或视频）
      /transfer - 在存储端之间传输文件
      /tasks - 管理任务
      /config - 用户设置（存储、静默模式、命名）
      /template - 设置文件名模板
      /dirs - 管理存储目录
      /rules - 管理存储规则
      /watch - 监听聊天和通知（UserBot）
      /parser - 管理解析器插件
      /update - 检查更新

      使用帮助: https://sabot.unv.app/usage
    cmd:
      start: "打开帮助"
      save: "保存文件"
      download: "下载链接（直链、Aria2、视频）"
      transfer: "在存储端之间传输文件"
      tasks: "管理任务"
      config: "用户设置"
      template: "设置文件名模板"
      dirs: "管理存储目录"
