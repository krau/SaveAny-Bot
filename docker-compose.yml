services:
  saveany-bot:
    image: ghcr.io/krau/saveany-bot:v1-beta
    container_name: saveany-bot
    restart: unless-stopped
    # Web UI 默认仅监听 127.0.0.1:28080；带访问 Token 的地址会打印在日志中
    # The Web UI binds to 127.0.0.1:28080 by default; the tokenized URL is printed in the log
    # 如需对外开放，取消注释并设置 SAVEANY_LISTEN
    # To expose it, uncomment SAVEANY_LISTEN
    # environment:
    #   SAVEANY_ADMIN_PASSWORD: change-me
    #   SAVEANY_LISTEN: 0.0.0.0:28080
    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads
      - ./cache:/app/cache
    # 使用 host 模式以便访问宿主机服务 (如代理)
    # 如果你对 Docker 网络模式熟悉, 可以自行修改
    network_mode: host
