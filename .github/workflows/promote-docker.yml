name: Promote Docker Image

on:
  workflow_dispatch:
    inputs:
      source:
        description: Existing image tag to promote
        required: true
        type: string
      target:
        description: Channel tag to create or update
        required: true
        default: v1-beta
        type: string

permissions:
  contents: read
  packages: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote image
        env:
          SOURCE: ${{ inputs.source }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          REPO="ghcr.io/krau/saveany-bot"
          case "$SOURCE" in *[!A-Za-z0-9._-]*) echo "invalid source tag"; exit 1 ;; esac
          case "$TARGET" in *[!A-Za-z0-9._-]*) echo "invalid target tag"; exit 1 ;; esac
          echo "Promoting $REPO:$SOURCE to $REPO:$TARGET"
          docker buildx imagetools create -t "$REPO:$TARGET" "$REPO:$SOURCE"
